# Temporary: runs scripts/webkit-evidence.mjs in WebKit on an iPhone profile
# and pushes what it wrote to a webkit-evidence/<sha> branch, because this
# session can't download WebKit or fetch Actions artifacts. Removed before merge.
name: WebKit evidence

on:
  push:
    branches: [claude/funny-euler-utwhob]

permissions:
  contents: write

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: sudo apt-get install -y ffmpeg
      - run: npm run build
      - run: |
          npx next start -p 3005 &
          for i in $(seq 60); do curl -sf -o /dev/null http://127.0.0.1:3005 && break; sleep 1; done
          node scripts/webkit-evidence.mjs http://127.0.0.1:3005 out https://wuntab.com
      - if: always()
        run: |
          cd out
          git init -q -b evidence
          git add -A
          git -c user.name=Marawan3 -c user.email=90366029+Marawan3@users.noreply.github.com commit -qm "WebKit evidence for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "evidence:webkit-evidence/${GITHUB_SHA::7}"
