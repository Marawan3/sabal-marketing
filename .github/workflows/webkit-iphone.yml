# The visuals' tests in WebKit on an iPhone profile, with motion and with
# reduced motion (playwright.config.ts), on every pull request and on main.
# Chromium runs locally; this is the only place WebKit runs.
name: WebKit iPhone

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: webkit-iphone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webkit-iphone:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run build
      - run: npx playwright test --project=webkit-iphone --project=webkit-iphone-reduced-motion --reporter=list
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-iphone-results
          path: test-results/
          retention-days: 14
